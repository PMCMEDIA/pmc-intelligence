<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMC Intelligence</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7f9;color:#102033}.side{position:fixed;width:250px;inset:0 auto 0 0;background:#0c1724;color:white;padding:28px 18px}.logo{font-size:29px;font-weight:900}.teal{color:#25bfd2}.main{margin-left:250px;padding:36px}.card{background:white;border:1px solid #e0e6eb;border-radius:14px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5de;border-radius:8px;margin:6px 0 14px}textarea{min-height:85px}.btn{background:#13a9bb;color:white;border:0;padding:12px 17px;border-radius:9px;font-weight:700;cursor:pointer}.muted{color:#6d7886}.tag{display:inline-block;background:#e7f8fa;color:#087d8d;padding:5px 9px;border-radius:20px;font-size:11px}@media(max-width:800px){.side{display:none}.main{margin:0;padding:20px}.grid{grid-template-columns:1fr}}</style></head>
<body><aside class="side"><div class="logo">PMC<span class="teal">.</span></div><p>INTELLIGENCE</p><hr><p>Strategy Builder</p><p>Research</p><p>Departments</p><p>Deck Builder</p></aside><main class="main"><h1>PMC Intelligence</h1><p class="muted">Client URL → research → discovery → integrated PMC strategy.</p>
<div class="card"><h2>New Strategy Project</h2><div class="grid"><div><b>Client</b><input id=c></div><div><b>Website URL</b><input id=u placeholder="https://client.com"></div><div><b>Industry</b><select id=i><option>Healthcare</option><option>Restaurant / Hospitality</option><option>Insurance</option><option>Financial Services</option><option>B2B</option><option>Other</option></select></div><div><b>Budget</b><input id=b placeholder="TBD is okay"></div></div><b>Primary business goal</b><textarea id=g></textarea><button class=btn onclick=build()>Research + Build Strategy</button></div><div id=o></div>
<script>async function build(){o.innerHTML='<div class=card><h2>Researching…</h2></div>';let r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client:c.value||'New Client',url:u.value,industry:i.value,budget:b.value||'TBD',goal:g.value||'Grow qualified demand'})});let p=await r.json();let facts=p.strategy.facts.map(x=>'<li><b>'+x.source+':</b> '+x.label+' — '+x.value+'</li>').join('');let qs=p.questions.map(x=>'<li>'+x+'</li>').join('');let ds=Object.entries(p.strategy.departments).map(([k,v])=>'<h3>'+k+'</h3><p>'+v.join(' • ')+'</p>').join('');o.innerHTML='<div class=card><span class=tag>'+p.status+'</span><h2>Verified Research</h2><ul>'+facts+'</ul><h2>Smart Discovery</h2><ul>'+qs+'</ul></div><div class=card><h2>Executive Strategy</h2><p>'+p.strategy.executive+'</p>'+ds+'</div>'}</script></main></body></html>
