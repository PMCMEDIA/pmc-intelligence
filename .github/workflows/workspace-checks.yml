name: Workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py workspace_api.py workspace_core.py
      - run: node --check static/workspace_modes.js
      - run: python -m unittest discover -s tests -p 'test_workspace*.py' -v
