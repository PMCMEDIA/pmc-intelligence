name: Hub navigation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hub-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: node --check static/hub_navigation.js
      - run: python -m unittest discover -s tests -p 'test_workspace*.py' -v
      - run: python tests/hub_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-navigation-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
