name: Strategy template checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  template-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py workspace_api.py workspace_core.py pmc_template_library.py proposal_blueprint.py
      - run: python -m unittest discover -s tests -p 'test_*template*.py' -v
      - name: Create sanitized fictional sample for visual review
        shell: python
        run: |
          import sys, json, os
          from pathlib import Path
          sys.path.insert(0,'tests')
          from test_master_template import fixture
          from deck_engine import default_outline, build_pptx
          from pmc_template_library import template_status
          out=Path('artifacts');out.mkdir(exist_ok=True)
          project=fixture();project['deck_outline']=default_outline(project)
          (out/'PMC_Master_Template_Sample.pptx').write_bytes(build_pptx(project).getvalue())
          (out/'template-validation.json').write_text(json.dumps({'commit':os.getenv('GITHUB_SHA'),'template':template_status(),'slide_count':len(project['deck_outline']),'fictional_sample':True},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: master-template-validation
          path: |
            artifacts/PMC_Master_Template_Sample.pptx
            artifacts/template-validation.json
          retention-days: 7
