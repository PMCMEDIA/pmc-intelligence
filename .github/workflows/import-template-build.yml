name: Apply verified template integration
on:
  push:
    branches: [feature/template-driven-strategy]
    paths: [.github/workflows/import-template-build.yml]
permissions:
  contents: write
concurrency:
  group: template-feature-import
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'PMCMEDIA/pmc-intelligence' && github.ref == 'refs/heads/feature/template-driven-strategy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/template-driven-strategy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source and result hashes before writing
        shell: python
        run: |
          from pathlib import Path
          from hashlib import sha256
          import json, subprocess
          plan = json.loads(Path('tools/template-edit-plan.json').read_text())
          subprocess.run(['git','merge-base','--is-ancestor',plan['base_commit'],'HEAD'],check=True)
          allowed = {'deck_engine.py','workspace_core.py','workspace_api.py','app.py','static/workspace_modes.js','templates/workspace.html','.github/workflows/hub-checks.yml','.github/workflows/strategy-template-checks.yml','WORKSPACE_MODES.md'}
          assert {entry['path'] for entry in plan['files']} == allowed
          prepared = {}
          for entry in plan['files']:
              path = Path(entry['path'])
              original = path.read_text()
              assert sha256(original.encode()).hexdigest() == entry['before_sha256'], str(path)+' changed; refusing overwrite'
              result = original
              last = len(original)+1
              for start,end,replacement in reversed(entry['edits']):
                  assert 0 <= start <= end < last
                  result = result[:start]+replacement+result[end:]
                  last = start
              assert sha256(result.encode()).hexdigest() == entry['after_sha256'], str(path)+' result does not match tested copy'
              if not str(path).startswith('.github/'):
                  prepared[path] = result
          for path,result in prepared.items():
              path.write_text(result)
              print('Verified and applied:',path)
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py workspace_api.py workspace_core.py pmc_template_library.py proposal_blueprint.py
      - run: node --check static/workspace_modes.js
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit only the requested feature integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/template-edit-plan.json
          git add deck_engine.py workspace_core.py workspace_api.py app.py static/workspace_modes.js templates/workspace.html WORKSPACE_MODES.md
          git commit -m 'Connect PMC master preview and export while preserving saved legacy decks'
          git push origin HEAD:feature/template-driven-strategy
