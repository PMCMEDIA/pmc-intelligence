services:
  - type: web
    name: pmc-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/pmc_intelligence.db
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: pmc-intelligence-data
      mountPath: /var/data
      sizeGB: 1
